<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAD MAX | Hacker Lab</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#030807;
    color:#d8fff1;
    font-family:Arial,Helvetica,sans-serif;
}

/* ===== HEADER ===== */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(2,8,7,.96);
    border-bottom:1px solid #00ff9c;
    padding:15px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    color:#00ff9c;
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
}

.logo small{
    display:block;
    color:#6affc5;
    font-size:9px;
    letter-spacing:3px;
}

nav{
    display:flex;
    gap:22px;
}

nav a{
    color:#b9eedd;
    text-decoration:none;
    font-size:14px;
}

nav a:hover{
    color:#00ff9c;
}

/* ===== HERO ===== */

.hero{
    min-height:570px;
    padding:80px 7%;
    display:flex;
    align-items:center;
    background:
        radial-gradient(circle at 75% 45%,rgba(0,255,156,.15),transparent 30%),
        radial-gradient(circle at 20% 20%,rgba(0,180,255,.08),transparent 30%),
        #030807;
}

.hero-text{
    max-width:700px;
}

.tag{
    display:inline-block;
    padding:8px 14px;
    border:1px solid #00ff9c;
    border-radius:5px;
    color:#00ff9c;
    font-family:monospace;
    margin-bottom:20px;
}

.hero h1{
    font-size:58px;
    margin:0;
    line-height:1.05;
}

.green{
    color:#00ff9c;
    text-shadow:0 0 18px rgba(0,255,156,.5);
}

.hero p{
    color:#9bbcb0;
    max-width:650px;
    font-size:18px;
    line-height:1.7;
}

.btn{
    display:inline-block;
    padding:14px 25px;
    margin:10px 8px 0 0;
    border:1px solid #00ff9c;
    border-radius:7px;
    color:#00ff9c;
    text-decoration:none;
    font-weight:bold;
    background:#04130e;
}

.btn.primary{
    background:#00d985;
    color:#00140d;
}

.btn:hover{
    box-shadow:0 0 20px rgba(0,255,156,.35);
}

/* ===== NOTICE ===== */

.notice{
    padding:13px;
    text-align:center;
    background:#06140f;
    border-top:1px solid #063d2c;
    border-bottom:1px solid #063d2c;
    color:#00ff9c;
    font-family:monospace;
}

/* ===== SECTION ===== */

.container{
    width:92%;
    max-width:1200px;
    margin:auto;
}

section{
    padding:65px 0;
}

.section-title{
    font-size:32px;
    margin-bottom:10px;
}

.section-sub{
    color:#79968c;
    margin-bottom:30px;
}

/* ===== STATS ===== */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    padding:35px 0;
}

.stat{
    background:#06100d;
    border:1px solid #123c2f;
    border-radius:10px;
    padding:25px;
    text-align:center;
}

.stat strong{
    display:block;
    color:#00ff9c;
    font-size:28px;
    margin-bottom:7px;
}

.stat span{
    color:#88a99d;
}

/* ===== LABS ===== */

.labs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.lab{
    background:#06100d;
    border:1px solid #164534;
    border-radius:12px;
    padding:22px;
    transition:.2s;
}

.lab:hover{
    transform:translateY(-4px);
    border-color:#00ff9c;
    box-shadow:0 0 20px rgba(0,255,156,.1);
}

.lab-icon{
    font-size:35px;
}

.lab h3{
    color:#fff;
}

.lab p{
    color:#829f94;
    line-height:1.6;
}

.level{
    display:inline-block;
    padding:5px 9px;
    border-radius:5px;
    font-size:11px;
    background:#10271f;
    color:#00ff9c;
}

.lab button{
    margin-top:15px;
    padding:10px 15px;
    border:1px solid #00ff9c;
    background:transparent;
    color:#00ff9c;
    border-radius:6px;
    cursor:pointer;
}
